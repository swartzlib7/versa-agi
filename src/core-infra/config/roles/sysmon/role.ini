[role]
id=sysmon
name=System Monitor
description=System health monitoring, resource tracking, and alerting

[poise]
# Identity anchor style: "full" retains philosophical text, "compact" uses a 2-line identity
anchor_style=compact

[gemini]
# Per-role model override. Leave blank to use system default from setup.ini.
# Supported: gemini-3-flash-preview, gemini-3.1-flash-lite-preview
model=gemini-3.1-flash-lite-preview
