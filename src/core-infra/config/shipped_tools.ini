[pipx]
# Command-line programs installed with pipx. PINNED.
# huggingface-hub gives the `hf` command, used to download local models. Setup
# installs it only on a machine that serves local models and only when the
# command is missing, so a machine that already has it keeps its version.
# 2.4.0 was the current stable version on PyPI on the date below.
_checked = 2026-11-21
huggingface-hub = 2.4.0

[browser]
# The headless browser. Not installed on its own: `playwright install chromium`
# downloads the browser build that the pinned playwright package names, so the
# pin in [python.harness] is the pin. Recorded here for information.
_pinned_by = python.harness playwright
_checked = 2026-11-21
chromium = 148.0.7778.96
chromium_revision = 1223

[apt]
# Operating-system packages. TRACKED: setup takes the version the distribution
# ships (a version number of one Ubuntu release does not exist on another).
# The value is the version on the reference machine.
_reference = Ubuntu 24.04.5 LTS
_checked = 2026-11-21
# Installed by setup when missing
python3-venv = 3.12.3-0ubuntu2.1
python3-pip = 24.0+dfsg-1ubuntu1.3+esm3
pipx = 1.4.3-1
xclip = 0.13-3
ffmpeg = 7:6.1.1-3ubuntu5+esm15
fuse3 = 3.14.0-5build1
# Required: setup checks for these and names the one that is missing
git = 1:2.43.0-1ubuntu7.4
sqlite3 = 3.45.1-1ubuntu2.9
jq = 1.7.1-3ubuntu0.24.04.2
inotify-tools = 3.22.6.0-4
curl = 8.5.0-2ubuntu10.16
rsync = 3.2.7-1ubuntu1.5
# Used when present
logrotate = 3.21.0-2build1
openssh-server = 1:9.6p1-3ubuntu13.20

[floating]
# Taken at the newest version, on purpose or because no version of ours has been
# chosen yet. Value: where it comes from, then why it floats.
searxng = Docker image searxng/searxng:latest, pulled on every setup run. On purpose: search engines change how they answer and SearXNG's fixes arrive in new images (providers/searxng.sh).
docker = docker-ce from Docker's own apt repository, installed by providers/_common.sh only on a machine that has no Docker. No version chosen yet. Reference machine: Ubuntu's docker.io 29.1.3.
get-pip = https://bootstrap.pypa.io/get-pip.py, used only when a venv comes without pip. No version chosen yet.
