# Everything an install or update of Versa AGi puts on a machine, and the
# version each is shipped at. One place, so the versions can be reviewed and
# raised together. state_host_services.md §1.7.
#
# Every outside program or package setup installs belongs here: add it in the
# same change that makes setup install it.
#
# Three kinds of entry:
#   pinned    setup installs exactly this version ([rclone], [python.*]).
#   tracked   the operating system's own package: its version is whatever that
#             release of the system ships, so it is recorded, not forced ([apt]).
#   floating  taken at the newest version on purpose, with the reason ([floating]).
#
# A key that starts with "_" describes the section; it is not a package.
# Versions were read on the reference machine named in each section.

[rclone]
# Cloud storage for agents (skill cloud_storage.md). rclone's own build: the
# distribution's package is years behind (1.60.1 on Ubuntu 24.04).
# Installed only when the download matches the checksum.
version = v1.76.0
url = https://downloads.rclone.org/{version}/rclone-{version}-linux-{arch}.zip
# From https://downloads.rclone.org/v1.76.0/SHA256SUMS
sha256_amd64 = b00f00b3266c3764413afe599d3ec316f6f43b3e0ea8a0bc1d186d2133e46df7
sha256_arm64 = ee169016675e23a69d77240565133ff7dbc9b33d16fa8f7053d4af39f1eaeb78
checked = 2026-11-20

[python.harness]
