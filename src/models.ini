# ─────────────────────────────────────────────────
# Versa AGi — Model Registry
# ─────────────────────────────────────────────────
# Single source of truth for all supported models.
# Drives the model selector in agitop, context window
# configuration for the agent harness, and SYCL/GGUF
# downloads for the Intel inference backend.
#
# Sections:
#   [models]              — Cloud Native (Gemini) display labels
#   [third_party_models]  — Third-Party Cloud Providers (xAI, etc.)
#   [local_models]        — Local AI models (Ollama / SYCL)
#   [context_windows]     — Context window sizes (recommended,max tokens)
#   [sycl_models]         — Intel SYCL GGUF registry (repo,file,size_gb)
#
# Format:
#   [models/third_party_models/local_models]  key = Display Label
#   [context_windows]  key = recommended,max
#   [sycl_models]      key = hf_repo,gguf_filename,size_gb
#
# Cloud models have context_windows = 0,0 (managed server-side).
# Local models without a context_windows entry default to 4096.
#
# Managed via: agictl model registry add/update/remove
#         or: ./manage_registry.sh (interactive)
# ─────────────────────────────────────────────────

[models]
gemini-2.5-pro            = Gemini 2.5 Pro — Flagship reasoning, 1M context
gemini-2.5-flash          = Gemini 2.5 Flash — Fast, cost-efficient
gemini-3-pro-preview      = Gemini 3 Pro Preview — Advanced reasoning
gemini-3-flash-preview    = Gemini 3 Flash Preview — Frontier-class reduced cost
gemini-3.1-pro-preview    = Gemini 3.1 Pro Preview — Next-gen flagship reasoning
gemini-3.1-flash-lite-preview = Gemini 3.1 Flash Lite — Ultra-fast, lowest cost

[third_party_models]
grok-4-1-fast-reasoning   = Grok 4.1 Fast — Cost-efficient reasoning, 2M context (xAI)
grok-4.20-reasoning       = Grok 4.20 — Flagship xAI reasoning
gpt-5.5-2026-04-23        = GPT-5.5 — Flagship reasoning (OpenAI)
gpt-5.4-2026-03-05        = GPT-5.4 — Previous gen reasoning (OpenAI)
gpt-5.4-mini-2026-03-17   = GPT-5.4 Mini — Cost-efficient (OpenAI)
claude-opus-4-8            = Claude Opus 4.8 — Flagship reasoning (Anthropic)
claude-sonnet-4-6          = Claude Sonnet 4.6 — Fast reasoning (Anthropic)

[local_models]
qwen3.6:35b               = Qwen 3.6 35B — MoE reasoning, 128K context
gemma4:26b                = Gemma 4 26B — MoE (4B active), 256K context
gemma4:e4b                = Gemma 4 E4B — Edge optimized, 128K context
gemma4:e2b                = Gemma 4 E2B — Edge ultra-light, 128K context
gemma4:31b                = Gemma 4 31B — Dense flagship, 256K context

# ─────────────────────────────────────────────────
# Context Windows (tokens)
# Format: model_key = recommended_num_ctx,max_num_ctx
#
# recommended = operational default (balances quality vs VRAM)
# max         = model's actual capacity ceiling
#
# Cloud models: recommended=0 (managed server-side), max=actual limit (for trimmer)
# Local models without entry: defaults to 4096 (Ollama default)
#
# Updated via: agictl model add (auto-registers known models)
# ─────────────────────────────────────────────────

[context_windows]
# Cloud — recommended=0 (no num_ctx passed), max=actual token limit for trimmer
gemini-2.5-pro            = 0,1000000
gemini-2.5-flash          = 0,1000000
gemini-3-pro-preview      = 0,1000000
gemini-3-flash-preview    = 0,1000000
gemini-3.1-pro-preview    = 0,1000000
gemini-3.1-flash-lite-preview = 0,1000000

grok-4-1-fast-reasoning   = 0,2000000
grok-4.20-reasoning       = 0,1000000

gpt-5.5-2026-04-23        = 0,1000000
gpt-5.4-2026-03-05        = 0,131072
gpt-5.4-mini-2026-03-17   = 0,131072

claude-opus-4-8            = 0,200000
claude-sonnet-4-6          = 0,200000

# Generic Cloud Fallbacks (prefix matching — conservative)
gemini                    = 0,1000000
grok                      = 0,1000000
gpt                       = 0,131072
claude                    = 0,200000

# Qwen 3 family
qwen3.6:35b  = 32768,131072

# Gemma 4 family
gemma4:26b   = 32768,262144
gemma4:e4b   = 32768,131072
gemma4:e2b   = 16384,131072
gemma4:31b   = 32768,262144

# ─────────────────────────────────────────────────
# SYCL Model Registry (Intel ARC / llama-server)
#
# Format: model_key = hf_repo,gguf_filename,size_gb
#
# hf_repo   — HuggingFace repository for GGUF download
# gguf_file — Exact filename to download and load
# size_gb   — Approximate GGUF file size in GB (used for concurrency calculation)
#
# The max usable context is computed dynamically at setup time from:
#   Available VRAM = Total GPU VRAM - Model GGUF Size
#   Usable Context = f(Available VRAM, Parallel Slots, KV cache per token)
#
# Managed via: agictl model registry add/update/remove
#         or: ./manage_registry.sh (interactive)
# ─────────────────────────────────────────────────

[sycl_models]
gemma4:e4b   = unsloth/gemma-4-E4B-it-GGUF,gemma-4-E4B-it-Q4_K_M.gguf,5
gemma4:26b   = unsloth/gemma-4-26B-A4B-it-GGUF,gemma-4-26B-A4B-it-UD-Q4_K_M.gguf,16
gemma4:31b   = unsloth/gemma-4-31B-it-GGUF,gemma-4-31B-it-Q4_K_M.gguf,18
qwen3.6:35b  = unsloth/Qwen3.6-35B-A3B-GGUF,Qwen3.6-35B-A3B-UD-Q4_K_M.gguf,21
