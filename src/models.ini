# ─────────────────────────────────────────────────
# Versa AGi — Model Registry
# ─────────────────────────────────────────────────
# Single source of truth for all supported models.
# Drives the model selector in agitop, context window
# configuration for the agent harness, and SYCL/GGUF
# downloads for the Intel inference backend.
#
# THIS FILE IS THE SHIPPED TEMPLATE (stock manifest). The deployed copy at
# /etc/versa-agi/models.ini is REGENERATED from it on every setup.sh run (fresh
# and --update alike) by `agictl system reconcile-config`: the template wins for
# structure, comments, and stock rows; user content is preserved — the
# [catalog_custom]/[providers_custom] layer plus registry-added rows in
# [local_models]/[context_windows]/[sycl_models]. Customize via the dashboard/CLI,
# not by hand-editing the deployed file.
#
# Sections (two physically separated origins — Edition 2.x isolation model):
#   BASELINE (regenerated from setup.ini by `agictl model migrate` — DO NOT edit):
#   [providers]           — Provider registry baseline
#   [catalog]             — Unified model catalog baseline (one row per model)
#
#   USER LAYER (owned by the CLI / dashboard — never touched by migrate):
#   [providers_custom]    — Added/overridden providers
#   [catalog_custom]      — Added/overridden models
#
#   The loaders merge USER over BASELINE per key (whole-row override). So
#   setup.ini edits propagate via the baseline, while CLI/dashboard edits in the
#   custom layer always survive and win.
#
#   MODEL PARAMS (generation defaults — temperature, reasoning, passthrough):
#   [model_params]        — Baseline defaults (regenerated from template)
#   [model_params_custom] — User overrides (CLI / dashboard; never touched by migrate)
#   Keys: default | model:<id>
#   Value: JSON object, e.g. {"temperature":0.2,"reasoning_effort":"none"}
#           or {"reasoning_effort":"high","extra":{"top_p":0.9}}
#
#   LOCAL PIPELINE (owned by the local-model pipeline / registry — not by sync):
#   [local_models]        — Local AI model display labels (Ollama / SYCL)
#   [context_windows]     — Local context windows + conservative cloud prefixes
#   [sycl_models]         — Intel SYCL GGUF registry (repo,file,size_gb)
#
#   Cloud + third-party metadata (labels + context windows) lives SOLELY in
#   [catalog] — there are no separate [models]/[third_party_models] sections.
#   `agictl model migrate` re-selects which models ship from setup.ini and carries
#   their label/context from the [catalog] template above (the stock-metadata source).
#
# Format:
#   [providers*]       slug = enabled|Display Name|langchain_class
#   [catalog*]         key  = class|provider|enabled|coa_approved|ctx_recommended|ctx_max|Display Label
#                            class ∈ {cloud, third_party, local}
#   [local_models]     key = Display Label
#   [context_windows]  key = recommended,max
#   [sycl_models]      key = hf_repo,gguf_filename,size_gb
#
# Cloud models have ctx_recommended = 0 (managed server-side); ctx_max drives the
# harness trim budget. Local models without a context window default to 4096.
#
# Managed via: agictl model catalog add/update/remove   (writes [catalog_custom])
#              agictl provider add/enable/disable/remove (writes [providers_custom])
#              agictl model migrate                      (regenerate baseline from setup.ini)
#              agictl model sync                         (regenerate derived sections + paths.env)
#              agictl model registry add/update/remove   (SYCL GGUF metadata; legacy alias)
#         or: ./manage_registry.sh (interactive)
# ─────────────────────────────────────────────────

# ─────────────────────────────────────────────────
# Provider Registry — BASELINE (regenerated from setup.ini by `agictl model migrate`)
# slug = enabled|Display Name|langchain_class
#
# DO NOT hand-edit — changes here are overwritten on the next `setup.sh` run.
# Add or override providers via `agictl provider …` (writes [providers_custom]).
#
# `enabled` is non-secret. The API key lives in setup.ini [third_party].{slug}_api_key
# (or the Gemini key for google). A third-party model is available at runtime only
# when its model row is enabled AND its provider is enabled AND a key is present.
# ─────────────────────────────────────────────────

[providers]
google    = true|Google Gemini|ChatGoogleGenerativeAI
xai       = false|xAI (Grok)|ChatOpenAI
openai    = false|OpenAI (GPT)|ChatOpenAI
anthropic = false|Anthropic (Claude)|ChatAnthropic
openrouter = false|OpenRouter|ChatOpenAI
ollama    = true|Local (Ollama / SYCL)|ChatOllama

# ─────────────────────────────────────────────────
# Provider Registry — USER LAYER (owned by `agictl provider` / the dashboard)
# Overlays [providers] per slug. Never touched by `agictl model migrate`.
# ─────────────────────────────────────────────────

[providers_custom]

# ─────────────────────────────────────────────────
# Unified Model Catalog — BASELINE (regenerated from setup.ini by `agictl model migrate`)
# key = class|provider|enabled|coa_approved|ctx_recommended|ctx_max|Display Label
#
# DO NOT hand-edit — changes here are overwritten on the next `setup.sh` run.
# Add or override models via `agictl model catalog …` (writes [catalog_custom]).
#
# class         ∈ {cloud, third_party, local}
# enabled       — whether the model is offered in pickers / routed at runtime
# coa_approved  — whether the model may be assigned to the COA orchestrator
# ctx_*         — context window (recommended=0 for cloud; max drives the trim budget)
#
# [catalog] is the single source of truth read at runtime: the agitop model
# picker and the harness trim budget (model_context.py) read labels + context
# windows from here directly. `agictl model sync` regenerates only the
# cloud/third-party paths.env registries (membership) from the MERGED catalog.
# Local rows are advisory in this edition (the local pipeline still owns
# [local_models]/[context_windows]/VERSA_LOCAL_MODELS).
# ─────────────────────────────────────────────────

[catalog]
# Cloud Native (Gemini)
gemini-2.5-pro                = cloud|google|true|true|0|1000000|Gemini 2.5 Pro — Flagship reasoning, 1M context
gemini-2.5-flash              = cloud|google|true|true|0|1000000|Gemini 2.5 Flash — Fast, cost-efficient
gemini-2.5-flash-lite         = cloud|google|true|false|0|1000000|Gemini 2.5 Flash Lite — Ultra-fast, lightweight
gemini-2.0-flash              = cloud|google|true|false|0|1000000|Gemini 2.0 Flash — Previous gen multimodal
gemini-2.0-flash-lite         = cloud|google|true|false|0|1000000|Gemini 2.0 Flash Lite — Previous gen, high-frequency
gemini-3-pro-preview          = cloud|google|true|true|0|1000000|Gemini 3 Pro Preview — Advanced reasoning
gemini-3-flash-preview        = cloud|google|true|true|0|1000000|Gemini 3 Flash Preview — Frontier-class reduced cost
gemini-3.1-pro-preview        = cloud|google|true|true|0|1000000|Gemini 3.1 Pro Preview — Next-gen flagship reasoning
gemini-3.1-flash-lite-preview = cloud|google|true|false|0|1000000|Gemini 3.1 Flash Lite — Ultra-fast, lowest cost

# Third-Party Cloud Providers
grok-4-1-fast-reasoning       = third_party|xai|true|true|0|2000000|Grok 4.1 Fast — Cost-efficient reasoning, 2M context (xAI)
grok-4.20-reasoning           = third_party|xai|true|true|0|1000000|Grok 4.20 — Flagship xAI reasoning
gpt-5.5-2026-04-23            = third_party|openai|true|true|0|1000000|GPT-5.5 — Flagship reasoning (OpenAI)
gpt-5.4-2026-03-05            = third_party|openai|true|true|0|131072|GPT-5.4 — Previous gen reasoning (OpenAI)
gpt-5.4-mini-2026-03-17       = third_party|openai|true|true|0|131072|GPT-5.4 Mini — Cost-efficient (OpenAI)
claude-opus-4-8               = third_party|anthropic|true|true|0|200000|Claude Opus 4.8 — Flagship reasoning (Anthropic)
claude-sonnet-4-6             = third_party|anthropic|true|true|0|200000|Claude Sonnet 4.6 — Fast reasoning (Anthropic)
moonshotai/kimi-k2.7-code     = third_party|openrouter|true|true|0|262144|Kimi K2.7 Code — Moonshot AI (via OpenRouter)
deepseek/deepseek-v4-flash    = third_party|openrouter|true|true|0|1048576|DeepSeek V4 Flash (via OpenRouter)

# Local AI (Ollama / SYCL) — advisory in this edition
qwen3.6:35b                   = local|ollama|true|false|32768|131072|Qwen 3.6 35B — MoE reasoning, 128K context
gemma4:26b                    = local|ollama|true|false|32768|262144|Gemma 4 26B — MoE (4B active), 256K context
gemma4:e4b                    = local|ollama|true|false|32768|131072|Gemma 4 E4B — Edge optimized, 128K context
gemma4:e2b                    = local|ollama|true|false|16384|131072|Gemma 4 E2B — Edge ultra-light, 128K context
gemma4:31b                    = local|ollama|true|false|32768|262144|Gemma 4 31B — Dense flagship, 256K context

# ─────────────────────────────────────────────────
# Unified Model Catalog — USER LAYER (owned by `agictl model catalog` / the dashboard)
# Overlays [catalog] per key (whole-row override). Never touched by migrate.
# Disabling a baseline model writes a here-override with enabled=false.
# ─────────────────────────────────────────────────

[catalog_custom]

# ─────────────────────────────────────────────────
# Model Parameters — BASELINE (shipped defaults)
# key = JSON object (temperature, reasoning_effort, reasoning_max_tokens, extra)
# DO NOT hand-edit — customize via `agictl model params` (writes [model_params_custom]).
# ─────────────────────────────────────────────────

[model_params]
default = {"temperature":0.2,"reasoning_effort":"none"}

# ─────────────────────────────────────────────────
# Model Parameters — USER LAYER (owned by CLI / dashboard)
# Overlays [model_params] per key. Never touched by migrate.
# ─────────────────────────────────────────────────

[model_params_custom]

# ═════════════════════════════════════════════════
# LOCAL PIPELINE SEED — [local_models] (labels) + [context_windows] + [sycl_models]
# remain owned by the local-model pipeline / registry and are consumed by
# `agictl model migrate` to derive the LOCAL [catalog] rows. Cloud/third-party
# metadata now lives SOLELY in [catalog] above — there are no parallel
# [models]/[third_party_models] sections.
# To onboard a shipped CLOUD/third-party model: add its key to the relevant
# setup.ini list AND a [catalog] row above, then run `setup.sh --update`.
# ═════════════════════════════════════════════════

[local_models]
qwen3.6:35b               = Qwen 3.6 35B — MoE reasoning, 128K context
gemma4:26b                = Gemma 4 26B — MoE (4B active), 256K context
gemma4:e4b                = Gemma 4 E4B — Edge optimized, 128K context
gemma4:e2b                = Gemma 4 E2B — Edge ultra-light, 128K context
gemma4:31b                = Gemma 4 31B — Dense flagship, 256K context

# ─────────────────────────────────────────────────
# Context Windows (tokens)
# Format: model_key = recommended_num_ctx,max_num_ctx
#
# recommended = operational default (balances quality vs VRAM)
# max         = model's actual capacity ceiling
#
# Cloud models: recommended=0 (managed server-side), max=actual limit (for trimmer)
# Local models without entry: defaults to 4096 (Ollama default)
#
# Updated via: agictl model add (auto-registers known models)
# ─────────────────────────────────────────────────

[context_windows]
# Per-model cloud/third-party context windows now live SOLELY in [catalog]
# (ctx_recommended,ctx_max columns). This section keeps only the conservative
# generic prefix fallbacks (for unseen cloud variants) plus the pipeline-owned
# local-model entries. model_context.py reads [catalog] as authoritative and
# overlays this section underneath to fill gaps.

# Generic Cloud Fallbacks (prefix matching — conservative)
gemini                    = 0,1000000
grok                      = 0,1000000
gpt                       = 0,131072
claude                    = 0,200000

# Qwen 3 family
qwen3.6:35b  = 32768,131072

# Gemma 4 family
gemma4:26b   = 32768,262144
gemma4:e4b   = 32768,131072
gemma4:e2b   = 16384,131072
gemma4:31b   = 32768,262144

# ─────────────────────────────────────────────────
# SYCL Model Registry (Intel ARC / llama-server)
#
# Format: model_key = hf_repo,gguf_filename,size_gb
#
# hf_repo   — HuggingFace repository for GGUF download
# gguf_file — Exact filename to download and load
# size_gb   — Approximate GGUF file size in GB (used for concurrency calculation)
#
# The max usable context is computed dynamically at setup time from:
#   Available VRAM = Total GPU VRAM - Model GGUF Size
#   Usable Context = f(Available VRAM, Parallel Slots, KV cache per token)
#
# Managed via: agictl model registry add/update/remove
#         or: ./manage_registry.sh (interactive)
# ─────────────────────────────────────────────────

[sycl_models]
gemma4:e4b   = unsloth/gemma-4-E4B-it-GGUF,gemma-4-E4B-it-Q4_K_M.gguf,5
gemma4:26b   = unsloth/gemma-4-26B-A4B-it-GGUF,gemma-4-26B-A4B-it-UD-Q4_K_M.gguf,16
gemma4:31b   = unsloth/gemma-4-31B-it-GGUF,gemma-4-31B-it-Q4_K_M.gguf,18
qwen3.6:35b  = unsloth/Qwen3.6-35B-A3B-GGUF,Qwen3.6-35B-A3B-UD-Q4_K_M.gguf,21
