gemma4:e2b                    = local|ollama|true|false|16384|131072|Gemma 4 E2B — Edge ultra-light, 128K context
gemma4:31b                    = local|ollama|true|false|32768|262144|Gemma 4 31B — Dense flagship, 256K context

# ─────────────────────────────────────────────────
