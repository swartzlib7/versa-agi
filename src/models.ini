# Local AI (Ollama / SYCL) — advisory in this edition
qwen3.6:35b                   = local|ollama|true|false|32768|131072|Qwen 3.6 35B — MoE reasoning, 128K context
gemma4:26b                    = local|ollama|true|false|32768|262144|Gemma 4 26B — MoE (4B active), 256K context
